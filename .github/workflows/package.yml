name: Package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Validate release contents
        run: python scripts/check_release_artifacts.py dist
      - name: Install wheel in an isolated environment
        run: |
          python -m venv /tmp/evidencelink-wheel-smoke
          /tmp/evidencelink-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/evidencelink-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"
          /tmp/evidencelink-wheel-smoke/bin/evidencelink-download-datasets --list > /tmp/datasets.json
