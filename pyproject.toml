[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencelink"
version = "0.1.0"
description = "EvLink source-grounded evidence linking for Graph RAG and multi-hop question answering."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Xiao AI Lab" },
]
keywords = [
  "retrieval-augmented generation",
  "graph rag",
  "graphrag",
  "evidence retrieval",
  "multi-hop question answering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Xiao-AI-Lab/EvLink"
Documentation = "https://github.com/Xiao-AI-Lab/EvLink#readme"
Repository = "https://github.com/Xiao-AI-Lab/EvLink"
Issues = "https://github.com/Xiao-AI-Lab/EvLink/issues"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=7", "twine>=5"]

[project.scripts]
evidencelink-pipeline = "evidencelink.run_pipeline:main"
evidencelink-prepare-dataset = "evidencelink.prepare_dataset:main"
evidencelink-select = "evidencelink.run_evidence_selection:main"
evidencelink-reader-qa = "evidencelink.reader_qa:main"
evidencelink-download-datasets = "evidencelink.download_datasets:main"

[tool.setuptools.packages.find]
include = ["evidencelink*"]

[tool.setuptools.package-data]
evidencelink = ["data/*.json"]
